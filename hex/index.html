<script>
function randVar() {
  return '_u' + Math.floor(Math.random() * 899999 + 100000);
}

function toHex(str) {
  let hex = '';
  for (let i = 0; i < str.length; i++) {
    hex += '\\x' + str.charCodeAt(i).toString(16).padStart(2, '0');
  }
  return hex;
}

const foph75 = () => {
  const src = document.getElementById('inputSource').value;
  if (!src) return '';
  const v = randVar();
  const hex = toHex(src);
  return `(()=>{const ${v} = "${hex}";eval(${v});})();`;
}

let editor;

require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'}});
require(['vs/editor/editor.main'], function() {
  editor = monaco.editor.create(document.getElementById('editor'), {
    value: foph75(),
    language: 'javascript',
    theme: 'vs-dark',
    minimap: {enabled: false},
    automaticLayout: true,
    fontSize: 14,
    readOnly: true,
    wordWrap: 'on'
  });
});

function _fugi() {
  editor.setValue(foph75());
}

coo896r2 = () => {
